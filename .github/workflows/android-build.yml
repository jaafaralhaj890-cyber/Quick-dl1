name: Build QuickDL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. تحميل ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. تثبيت أدوات فك الضغط
      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 4. فك ضغط المشروع
      - name: Extract QuickDL project
        run: |
          unzip -o QuickDL-mobile-build-ready.zip
          echo "Project files:"
          find . -maxdepth 3 -name settings.gradle -o -name settings.gradle.kts

      # 5. تحديد مسار sdkmanager
      - name: Locate Android SDK manager
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found: $SDKMANAGER"

      # 6. قبول تراخيص Android
      - name: Accept Android licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      # 7. تثبيت Android SDK
      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8. إعداد Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 9. تحديد مجلد المشروع
      - name: Locate project directory
        run: |
          PROJECT_DIR=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      # 10. بناء APK
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon testDebugUnitTest assembleDebug

      # 11. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickDL-debug-apks
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
